spring.application.name=simulator


# ===============================
# CONFIGURACIÓN DE PUERTOS
# ===============================
# Puerto HTTP normal de Spring Boot
server.port=8081

# Puerto por el que escuchará el servidor gRPC
grpc.server.port=9090

# ===============================
# CONFIGURACIÓN DE BASE DE DATOS (POSTGRESQL)
# ===============================
# Cambia la contraseña por la que uses localmente (ej: adminpassword)
spring.datasource.url=jdbc:postgresql://localhost:5432/hardwareguru_sim
spring.datasource.username=postgres
spring.datasource.password=adminpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate: creará o actualizará las tablas automáticamente en base a nuestro código
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true