syntax = "proto3";

package simulator;

option java_multiple_files = true;
option java_package = "com.hardwareguru.simulator.grpc";

service SimulatorService {
  rpc SimularRendimiento (SimulacionRequest) returns (SimulacionResponse);
  rpc GuardarBuild (GuardarBuildRequest) returns (GuardarBuildResponse);
}

message SimulacionRequest {
  int32 cpu_tdp_watts = 1;
  int32 cpu_benchmark_score = 2;
  int32 gpu_tdp_watts = 3;
  int32 gpu_benchmark_score = 4;
  string resolucion = 5; 
  int32 psu_watts = 6;
  string user_id = 7;   
}

message SimulacionResponse {
  int32 consumo_total_watts = 1;
  int32 cuello_botella_porcentaje = 2;
  string estado = 3; 
  string motivo = 4; 
}

message GuardarBuildRequest {
  string user_id = 1;
  string nombre_build = 2;
  string cpu_id = 3;
  string gpu_id = 4;
  string motherboard_id = 5;
  string ram_id = 6;
  string psu_id = 7;
  string resolucion = 8;
  int32 consumo_total_watts = 9;
}

message GuardarBuildResponse {
  string build_id = 1;
  bool success = 2;
}