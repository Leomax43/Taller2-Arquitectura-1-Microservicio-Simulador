version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: hg_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: hardwareguru_sim
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: